version: 1
runsDir: tmp/verification
failureHint: >
  Stages run inside the discourse/discourse_test:release Docker image via bin/docker-test.
  The lint stage runs rubocop, stree, i18n lint, eslint and prettier; the spec stage runs the
  plugin RSpec suite including system specs.
  Open the failing stage's logFile for the offending files or failing examples.
stages:
  - name: lint
    command: bash bin/docker-test lint
  - name: spec
    command: bash bin/docker-test spec
