en:
  site_settings:
    mobile_push_enabled: "Enable push notifications to registered mobile app devices."
    mobile_push_firebase_service_account_json: "Firebase service account key (JSON) used to send messages through Firebase Cloud Messaging HTTP v1."
    mobile_push_firebase_project_id: "Firebase project ID. Leave blank to use the project ID from the service account key."
    mobile_push_privacy_mode: "How much notification text appears on the device. 'full' shows the topic title and excerpt; 'generic' shows only a neutral message."
    mobile_push_high_priority_notification_types: "Notification types sent with high priority, which may wake the device immediately."
    mobile_push_max_devices_per_user: "Maximum devices per user. Registering beyond this removes the least recently seen device."
    mobile_push_allowed_app_ids: "App IDs (for example com.example.app) allowed to register devices. Leave empty to allow any app."
    mobile_push_stale_device_days: "Devices not seen for this many days are reported as stale in diagnostics."
  discourse_mobile_push:
    notification:
      generic_body: "You have a new notification"
    test_notification:
      title: "%{site_title}"
      body: "This is a test notification. Push notifications are working."
  dashboard:
    problem:
      mobile_push_configuration: "Mobile push notifications cannot be delivered: the Firebase service account key is missing or invalid. Review the <a href='%{base_path}/admin/site_settings/category/discourse_mobile_push'>mobile push settings</a>."
      mobile_push_config_errors: "Firebase rejected mobile push notifications for several devices in the last day because of a configuration problem (for example a wrong project ID or missing permissions). Review the <a href='%{base_path}/admin/site_settings/category/discourse_mobile_push'>mobile push settings</a>."
