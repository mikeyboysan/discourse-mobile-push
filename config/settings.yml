discourse_mobile_push:
  mobile_push_enabled:
    default: false
  mobile_push_firebase_service_account_json:
    default: ""
    secret: true
    textarea: true
    shadowed_by_global: true
  mobile_push_firebase_project_id:
    default: ""
    shadowed_by_global: true
  mobile_push_privacy_mode:
    type: enum
    default: full
    choices:
      - full
      - generic
  mobile_push_high_priority_notification_types:
    type: list
    list_type: compact
    default: "private_message|mentioned|chat_mention"
    allow_any: false
    choices:
      - private_message
      - mentioned
      - group_mentioned
      - replied
      - quoted
      - posted
      - watching_first_post
      - chat_mention
      - chat_message
  mobile_push_max_devices_per_user:
    type: integer
    default: 10
    min: 1
    max: 100
  mobile_push_allowed_app_ids:
    type: list
    list_type: simple
    default: ""
  mobile_push_stale_device_days:
    type: integer
    default: 60
    min: 1
    max: 3650
